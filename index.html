const cell=v=>typeof v=='number'?(Number.isInteger(v)?v:f(v,4)):v,
tb=R.tables.map(q=>`<h3 style="margin:8px 0">${q.ti[L=='th'?0:1]}</h3><div class="tw"><table><tr>${q.h.map(h=>`<th>${TT[L][h]||h}</th>`).join('')}</tr>${q.r.map(r=>`<tr>${r.map(c=>`<td>${cell(c)}</td>`).join('')}</tr>`).join('')}</table></div>`).join('');
o.innerHTML=`<div class="card"><h2>${t('res')}</h2>${tb}<h2>${t('exl')}</h2><div class="ex">${R.ex(L)}</div><button class="btn" onclick="dlX()">${t('dlx')}</button></div>
<div class="card"><h2>${t('gr')}</h2><div class="chips">${R.ch.map(c=>`<button data-c="${c}" onclick="draw('${c}')">${t('c_'+c)}</button>`).join('')}</div><canvas id="cv"></canvas><br><button class="btn" onclick="dlP()">${t('dlp')}</button></div>`;draw(kind&&R.ch.includes(kind)?kind:R.ch[0])}
function setL(l){L=l;document.documentElement.lang=l;$('bth').classList.toggle('on',l=='th');$('ben').classList.toggle('on',l=='en');document.querySelectorAll('[data-k]').forEach(e=>e.textContent=t(e.dataset.k));if(R)render();else render()}
function msg(s,e){const m=$('msg');m.textContent=s;m.className=e?'e':''}
function load(dy,nd){S=parse(dy,nd);msg(t('loaded')+(S.dy?S.dy.length+' '+t('dy')+', ':'')+((S.nodes||S.ids||[]).length)+' '+t('nd'))}
function parse(dy,nd){const S={};if(dy&&dy.length>1){const h=dy[0].map(String),rows=dy.slice(1).filter(r=>r.length>=4&&r.slice(2).every(v=>typeof v=='number')),ids=[...new Set(rows.flatMap(r=>[String(r[0]),String(r[1])]))];S.dn={y:h[2],x:h.slice(3)};S.ids=ids;S.dy=rows.map(r=>({a:ids.indexOf(String(r[0])),b:ids.indexOf(String(r[1])),y:r[2],x:r.slice(3)}))}
if(nd&&nd.length>1){const h=nd[0].map(String);S.nn={y:h[3],x:h.slice(4)};S.nodes=nd.slice(1).filter(r=>r.length>=5&&r.slice(1).every(v=>typeof v=='number')).map(r=>({name:String(r[0]),lon:r[1],lat:r[2],y:r[3],x:r.slice(4)}))}return S}
function sample(){let s=7;const rnd=()=>(s=s*16807%2147483647)/2147483647,nz=()=>(rnd()+rnd()+rnd()-1.5)*1.6,
C=[['Thailand',15.9,100.9,8.6,4],['Vietnam',14.1,108.3,8.1,2],['Laos',19.9,102.5,7.7,1],['Cambodia',12.6,104.9,7.5,3],['Myanmar',21.9,95.9,7.3,2],['Malaysia',4.2,101.9,9.3,5],['Singapore',1.35,103.8,11,4],['Indonesia',-.8,113.9,8.4,6],['Philippines',12.9,121.8,8.1,6],['China',35.9,104.2,9.3,2],['India',20.6,78.9,7.9,6],['Japan',36.2,138.3,10.6,9],['South Korea',35.9,127.8,10.4,8],['Australia',-25.3,133.8,10.9,9],['Bangladesh',23.7,90.4,7.7,5]],
nodes=C.map(c=>({name:c[0],lat:c[1],lon:c[2]})),W=mkW(nodes),base=C.map(c=>2+.3*(c[3]-9)+.15*c[4]+nz()),wb=W.map(r=>r.reduce((a,w,j)=>a+w*base[j],0)),
dy=[['country_i','country_j','log_trade','log_distance','gdp_gap','fta']],nd=[['country','lon','lat','growth','log_gdppc','democracy']];
for(let a=0;a<C.length;a++)for(let b=a+1;b<C.length;b++){const d=Math.log(hav(nodes[a],nodes[b])),g=Math.abs(C[a][3]-C[b][3]),fta=+(rnd()<(d<8?.65:.25));dy.push([C[a][0],C[b][0],+(9-.8*d-.3*g+.9*fta+nz()*1.2+.3*(C[a][3]+C[b][3]-16)).toFixed(3),+d.toFixed(3),+g.toFixed(2),fta])}
C.forEach((c,i)=>nd.push([c[0],c[2],c[1],+(base[i]+.6*wb[i]).toFixed(3),c[3],c[4]]));return{dy,nd}}
function dlX(){const wb=XLSX.utils.book_new();R.tables.forEach((q,i)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([q.h.map(h=>TT[L][h]||h),...q.r]),('T'+(i+1)+' '+q.ti[1]).replace(/[\\\/?*\[\]:]/g,'').slice(0,31)));
XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([[R.ex(L).replace(/<br>/g,'\n').replace(/<[^>]+>/g,'')]]),'Interpretation');XLSX.writeFile(wb,'results_'+meth+'.xlsx')}
function dlP(){const a=document.createElement('a');a.href=$('cv').toDataURL('image/png');a.download=meth+'_'+kind+'.png';a.click()}
document.querySelectorAll('.m').forEach(b=>b.onclick=()=>{meth=b.dataset.m;document.querySelectorAll('.m').forEach(x=>x.classList.toggle('on',x==b))});
$('bs').onclick=()=>{const s=sample();load(s.dy,s.nd)};
$('bd').onclick=()=>{const s=sample(),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(s.dy),'Dyads');XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(s.nd),'Nodes');XLSX.writeFile(wb,'sample_polnet.xlsx')};
$('f').onchange=e=>{const fl=e.target.files[0];if(!fl)return;const r=new FileReader();r.onload=ev=>{try{const wb=XLSX.read(ev.target.result,{type:'array'}),g=n=>wb.Sheets[n]?XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1}):null;load(g('Dyads')||(wb.SheetNames.length&&!wb.Sheets.Nodes?XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1}):null),g('Nodes'))}catch(x){msg(x.message,1)}};r.readAsArrayBuffer(fl)};
$('br').onclick=()=>{try{if(!S)throw Error(t('nodata'));R=M[meth](S);msg('');kind=null;render()}catch(e){msg(e.message,1)}};
$('bx').onclick=()=>{S=R=null;kind=null;if(ch){ch.destroy();ch=null}$('f').value='';$('np').value=999;msg('');render()};
setL('th');
</script></body></html>
